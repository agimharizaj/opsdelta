<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2EDE5"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix values="0 0 0 0 0.05 0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 0.04 0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="black" filter="url(#grain)" opacity="0.4"/>

  <!-- Soft accent glow -->
  <circle cx="1050" cy="100" r="280" fill="#D9472A" opacity="0.06"/>
  <circle cx="120" cy="540" r="240" fill="#3F5E4A" opacity="0.05"/>

  <!-- Eyebrow -->
  <text x="80" y="130" font-family="JetBrains Mono, monospace" font-size="22" fill="#5A5650" letter-spacing="3">
    OPSDELTA · A DIAGNOSTIC FOR OPERATORS
  </text>

  <!-- Headline -->
  <text x="80" y="280" font-family="Fraunces, Georgia, serif" font-size="100" font-weight="600" fill="#0E0E0E" letter-spacing="-3">
    Find the hours
  </text>
  <text x="80" y="390" font-family="Fraunces, Georgia, serif" font-size="100" font-weight="600" fill="#0E0E0E" letter-spacing="-3">
    your operation is
  </text>
  <text x="80" y="500" font-family="Fraunces, Georgia, serif" font-size="100" font-weight="600" fill="#D9472A" letter-spacing="-3" font-style="italic">
    quietly leaking.
  </text>

  <!-- Footer -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="#0E0E0E" stroke-opacity="0.1"/>
  <text x="80" y="595" font-family="Inter, sans-serif" font-size="22" fill="#5A5650">
    Free 3-minute audit · Personalised roadmap · No pitch
  </text>
  <text x="1120" y="595" font-family="JetBrains Mono, monospace" font-size="20" fill="#0E0E0E" text-anchor="end">
    opsdelta.vercel.app
  </text>
</svg>
